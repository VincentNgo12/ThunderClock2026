// File: orientation.proto
// Purpose: Versioned wearable telemetry with orientations and optional sensor readings.
// Contributors: Unassigned
syntax = "proto3";
package telemetry.orientation.v1;

message Quaternion {
  float w = 1;
  float x = 2;
  float y = 3;
  float z = 4;
}

message Orientation {
  // IDs 1–4 are pelvis, lumbar, thoracic and upper thoracic.
  optional uint32 sensor_id = 1;
  optional bool valid = 2;
  // Unit quaternion from segment-local to world. Absent when valid is false.
  Quaternion rotation = 3;
}

message Environment {
  // Presence indicates a usable reading, including zero. Omit unavailable values.
  optional float temperature_c = 1;     // AHT21, degrees Celsius.
  optional float humidity_percent = 2;  // AHT21, relative humidity from 0 to 100.
  optional uint32 air_quality_index = 3; // ENS160 AQI-UBA category from 1 to 5.
  optional uint32 eco2_ppm = 4;          // ENS160 estimated CO2-equivalent ppm.
  optional uint32 tvoc_ppb = 5;          // ENS160 estimated TVOC ppb.
  optional float noise_relative_db = 6; // INMP441 relative trend in dB.
}

message OrientationPacket {
  // Version 1 carries orientations only. Version 2 allows additional readings.
  optional uint32 version = 16;
  // Both counters wrap at 2^32. Time is collection uptime in milliseconds.
  optional uint32 sequence = 17;
  optional uint32 sample_time_ms = 18;
  // Exactly one entry per sensor ID, in any order.
  repeated Orientation orientations = 19;
  Environment environment = 20;
  // Omit each reading when it is unavailable or stale.
  optional float heart_rate_bpm = 21;
  optional float spo2_percent = 22; // Peripheral oxygen saturation estimate, 0 to 100%.
}
