[env:adafruit_feather_esp32s3]

platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = adafruit_feather_esp32s3
framework = arduino
; Explicit name used by the pinned Arduino core for the Feather's 4 MB TinyUF2 layout.
board_build.partitions = tinyuf2-partitions-4MB.csv
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17

; Arduino-ESP32 includes FreeRTOS.
; Add sensor, fusion, BLE and encoding dependencies with their implementations.

lib_deps =
    adafruit/Adafruit BusIO
    adafruit/Adafruit Unified Sensor
    adafruit/Adafruit ICM20X
    h2zero/NimBLE-Arduino
    nanopb/Nanopb@^0.4.92

custom_nanopb_protos =
    +<proto/*.proto>
